<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web NU Ranting Pekuncen</title>
    <meta name="description" content="Portal Berita dan Sistem Informasi Keanggotaan Nahdlatul Ulama (NU) Ranting Pekuncen." />
    <meta property="og:title" content="Web NU Ranting Pekuncen" />
    <meta property="og:description" content="Portal Berita dan Sistem Informasi Keanggotaan Nahdlatul Ulama (NU) Ranting Pekuncen." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <script>
        (() => {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const useDark = savedTheme === 'dark' || (!savedTheme && systemDark);
            document.documentElement.classList.toggle('dark', useDark);
        })();
    </script>
</head>
<body class="min-h-screen bg-white text-[#15201B] antialiased dark:bg-[#101412] dark:text-[#e0e3df]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
